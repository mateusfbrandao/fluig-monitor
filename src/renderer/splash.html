<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'unsafe-inline'"
    />
    <title>Fluig Monitor</title>
  </head>
  <body
    style="
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: transparent;
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    "
  >
    <svg
      width="700"
      height="200"
      viewBox="0 0 700 200"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <defs>
        <linearGradient id="splash_bg" x1="0" y1="0" x2="700" y2="200" gradientUnits="userSpaceOnUse">
          <stop stop-color="#0b0f19" />
          <stop offset="0.5" stop-color="#0e1424" />
          <stop offset="1" stop-color="#111827" />
        </linearGradient>

        <linearGradient id="splash_accent" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#4f46e5" />
          <stop offset="40%" stop-color="#6366f1" />
          <stop offset="75%" stop-color="#0ea5e9" />
          <stop offset="100%" stop-color="#38bdf8" />
        </linearGradient>

        <linearGradient id="hex_border" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="28%" stop-color="#4f46e5" />
          <stop offset="72%" stop-color="#6366f1" />
          <stop offset="100%" stop-color="#0ea5e9" />
        </linearGradient>

        <linearGradient id="hex_plate" x1="0.2" y1="0" x2="0.8" y2="1">
          <stop offset="0%" stop-color="#0e1424" />
          <stop offset="50%" stop-color="#090d16" />
          <stop offset="100%" stop-color="#111827" />
        </linearGradient>

        <linearGradient id="fluidGrad" x1="0" y1="1" x2="0.8" y2="0">
          <stop offset="0%" stop-color="#4338ca" />
          <stop offset="40%" stop-color="#4f46e5" />
          <stop offset="75%" stop-color="#2563eb" />
          <stop offset="100%" stop-color="#38bdf8" />
        </linearGradient>

        <linearGradient id="pulseLineGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
          <stop offset="20%" stop-color="#7dd3fc" stop-opacity="0.9" />
          <stop offset="50%" stop-color="#ffffff" />
          <stop offset="80%" stop-color="#38bdf8" />
          <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.25" />
        </linearGradient>

        <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="45%" stop-color="#38bdf8" />
          <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
        </radialGradient>

        <filter id="splashGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <clipPath id="splashClip">
          <rect width="700" height="200" rx="24" />
        </clipPath>
      </defs>

      <g clip-path="url(#splashClip)">
        <!-- Fundo Card -->
        <rect width="700" height="200" fill="url(#splash_bg)" />

        <!-- Barra Inferior de Destaque -->
        <rect y="194" width="700" height="6" fill="url(#splash_accent)" />

        <!-- Borda Sutil -->
        <rect width="700" height="200" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" />

        <!-- LOGO HEXAGONAL (Escala ajustada para 140x140 centrado em y=30) -->
        <g transform="translate(56, 26) scale(0.288)" filter="url(#splashGlow)">
          <path d="M 240.00 39.24 A 32 32 0 0 1 272.00 39.24 L 435.72 133.76 A 32 32 0 0 1 451.72 161.48 L 451.72 350.52 A 32 32 0 0 1 435.72 378.24 L 272.00 472.76 A 32 32 0 0 1 240.00 472.76 L 76.28 378.24 A 32 32 0 0 1 60.28 350.52 L 60.28 161.48 A 32 32 0 0 1 76.28 133.76 Z" fill="url(#hex_border)" />
          <path d="M 243.00 61.51 A 26 26 0 0 1 269.00 61.51 L 417.94 147.49 A 26 26 0 0 1 430.94 170.01 L 430.94 341.99 A 26 26 0 0 1 417.94 364.51 L 269.00 450.49 A 26 26 0 0 1 243.00 450.49 L 94.06 364.51 A 26 26 0 0 1 81.06 341.99 L 81.06 170.01 A 26 26 0 0 1 94.06 147.49 Z" fill="url(#hex_plate)" />
          <path d="M 246.00 83.77 A 20 20 0 0 1 266.00 83.77 L 400.15 161.23 A 20 20 0 0 1 410.15 178.55 L 410.15 333.45 A 20 20 0 0 1 400.15 350.77 L 266.00 428.23 A 20 20 0 0 1 246.00 428.23 L 111.85 350.77 A 20 20 0 0 1 101.85 333.45 L 101.85 178.55 A 20 20 0 0 1 111.85 161.23 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.25" />

          <path
            d="M256 112
               C274 148 344 246 344 316
               C344 366 305 406 256 406
               C207 406 168 366 168 316
               C168 246 238 148 256 112 Z"
            fill="url(#fluidGrad)"
          />

          <path
            d="M256 126
               C240 156 186 248 186 314
               C186 338 194 358 208 374
               C196 352 192 332 192 312
               C192 248 244 162 256 126 Z"
            fill="#ffffff"
            opacity="0.32"
          />

          <path
            d="M72 312
               L148 312
               L172 312
               L194 274
               L222 364
               L256 182
               L288 338
               L314 312
               L340 312
               L440 312"
            fill="none"
            stroke="url(#pulseLineGrad)"
            stroke-width="14"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <circle cx="256" cy="182" r="16" fill="url(#beaconGlow)" />
          <circle cx="256" cy="182" r="7" fill="#ffffff" />
          <circle cx="72" cy="312" r="8" fill="url(#beaconGlow)" />
          <circle cx="72" cy="312" r="4" fill="#ffffff" />
          <circle cx="440" cy="312" r="8" fill="url(#beaconGlow)" />
          <circle cx="440" cy="312" r="4" fill="#ffffff" />
        </g>

        <!-- TIPOGRAFIA -->
        <!-- Fluig Monitor (Centralizado verticalmente) -->
        <text
          x="232"
          y="116"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="52"
          font-weight="800"
          fill="#F8FAFC"
          letter-spacing="-0.5"
        >Fluig <tspan fill="#38bdf8">Monitor</tspan></text>
      </g>
    </svg>
  </body>
</html>
